name: Build GTK4 Anylinux AppImage

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Check if Release Already Exists
        id: check
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm git github-cli

          git clone https://gitlab.com/kazamos/appgallery.git
          cd appgallery

          latestTag=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "v0.0.0")
          echo "tag=${latestTag}" >> "$GITHUB_OUTPUT"

          RELEASE_TAG="appgallery-${latestTag}"
          if gh release view "$RELEASE_TAG" --repo ${{ github.repository }} &>/dev/null; then
            echo "Release $RELEASE_TAG already exists, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm base-devel wget gtk4 polkit rustup patchelf strace tree
          rustup default stable

          cd appgallery
          cargo build --release
          ./packaging/install.sh
          ../.github/scripts/anylinux_appimage
          cd ..
          rm -rf appgallery

      - name: Upload Compiled AppImage Artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v6
        with:
          name: AppImage
          path: ./dist/*.AppImage*

      - name: Create Release
        if: steps.check.outputs.skip == 'false'
        run: |
          RELEASE_TAG="appgallery-${{ steps.check.outputs.tag }}"
          gh release create "$RELEASE_TAG" \
            ./dist/*.AppImage \
            ./dist/*.zsync \
            --generate-notes \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
