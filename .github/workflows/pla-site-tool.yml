name: Build pla-site-tool

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build
        id: build
        run: |
          pacman -Syu --noconfirm base-devel wget rustup git tree patchelf strace xorg-server-xvfb musl github-cli
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

          git clone https://gitlab.com/kazam0180/pla-site-tool.git
          cd pla-site-tool
          cargo build --target x86_64-unknown-linux-musl --release
          cp target/x86_64-unknown-linux-musl/release/pla-site-tool /usr/bin/
          sed -i 's|--prefer-nano|--add-common --prefer-nano|g' anylinux_appimage
          mkdir -p AppDir
          echo -e "[Desktop Entry]\nHidden=false\nTryExec=xfce4-clipman\nExec=xfce4-clipman" > AppDir/pla-site-tool.desktop
          echo "<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16.933 16.933"><circle cx="8.466" cy="8.466" r="7.144" fill="#949dac" style="paint-order:stroke fill markers"/><path fill="none" d="M0 0h16.933v16.933H0z"/><circle cx="12.171" cy="6.08" r="1.323" fill="#fff" opacity=".5" style="paint-order:stroke markers fill"/><path d="M8.121 19.438A27 27 0 0 0 5 32a27 27 0 0 0 27 27 27 27 0 0 0 13.084-3.418A50 50 0 0 0 8.121 19.437z" opacity=".15" style="paint-order:stroke fill markers" transform="scale(.26458)"/><path d="M58.9 33.996a40 40 0 0 0-30.713 24.699 27 27 0 0 0 3.812.305 27 27 0 0 0 26.9-25.004z" opacity=".05" style="paint-order:stroke fill markers" transform="scale(.26458)"/></svg>" > AppDir/.DirIcon
          ./anylinux_appimage

          export latestTag=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "v0.0.0")
          echo "tag=${latestTag}" >> $GITHUB_OUTPUT
           
          mv dist ../
          rm -rf pla-site-tool

      - name: Upload Compiled AppImage Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AppImage
          path: ./dist/*.AppImage*

      - name: Check if Release Exists
        id: release_check
        run: |
          RELEASE_TAG="appgallery-${{ steps.build.outputs.tag }}"
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.release_check.outputs.exists == 'false'
        run: |
          RELEASE_TAG="pla-site-tool-${{ steps.build.outputs.tag }}"
          gh release create "$RELEASE_TAG" \
            ./dist/*.AppImage \
            ./dist/*.zsync \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
